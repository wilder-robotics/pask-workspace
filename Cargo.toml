[workspace]
resolver = "3"
members = [
    "crates/pask-wire",
    "crates/pask-wire-cli",
    "crates/pask-adapter",
    "crates/pask-site",
    "crates/pask-attest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/actionrob/pask-workspace"
authors = ["Wilder Robotics"]

[workspace.lints.rust]
unsafe_code = "forbid"
