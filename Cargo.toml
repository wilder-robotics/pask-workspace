[workspace]
resolver = "3"
members = [
    "crates/pask-wire",
    "crates/pask-wire-cli",
    "crates/pask-adapter",
    "crates/pask-site",
    "crates/pask-attest",
    "crates/pask-ts-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
homepage = "https://pask-witness.com"
repository = "https://github.com/wilder-robotics/pask-workspace"
authors = ["Wilder Management Inc. (dba Wilder Robotics) <rob@wilder-robotics.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"
