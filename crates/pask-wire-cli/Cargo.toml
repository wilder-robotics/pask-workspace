[package]
name = "pask-wire-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
# Apache-2.0, not the workspace AGPL-3.0-only default. This binary is a
# conformance tool an implementer runs against their own implementation, so it
# must not require a copyleft review. It depends only on pask-wire. See
# LICENSING.md.
license = "Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/pask-wire-cli"
homepage.workspace = true
readme = "README.md"
keywords = ["cose", "scitt", "conformance", "cli", "receipts"]
categories = ["command-line-utilities", "cryptography"]
authors.workspace = true
description = "Command-line producer, supplied-key verifier, and canonical-example emitter for Pask receipts (wilder.pser/0.5, 0.6, 0.7); not a complete conformance certifier"

# Repository-only integration checks. Both tests read the Internet-Draft under
# `../../docs` (and the second also reads the two vocabulary JSON files at the
# repository root), so they can only run from a workspace checkout and would
# fail to find their inputs inside a standalone package archive. They stay in
# `tests/` and keep running in workspace CI; only the archive omits them. The
# archive keeps `tests/canonical_examples_are_valid_payloads.rs`, which covers
# the portable part of what they check.
exclude = [
    "/tests/draft_example_is_generated.rs",
    "/tests/draft_examples_are_validated.rs",
]

[features]
default = []
es256 = ["pask-wire/es256"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["pem", "pkcs8"] }
pask-wire = { version = "0.2.0", path = "../pask-wire", features = ["std"] }

[dev-dependencies]
# Test-only inspection of complete draft rules; no runtime API expansion.
serde_json = { version = "1.0.140", default-features = false, features = ["alloc", "float_roundtrip"] }

[lints]
workspace = true
