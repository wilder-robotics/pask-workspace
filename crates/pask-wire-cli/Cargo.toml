[package]
name = "pask-wire-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line producer, verifier, and optional adapter client for Pask receipts"

[features]
default = []
adapter = ["dep:pask-adapter"]
es256 = ["pask-wire/es256"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["pem", "pkcs8"] }
pask-adapter = { path = "../pask-adapter", optional = true }
pask-wire = { path = "../pask-wire", features = ["std"] }

[lints]
workspace = true
