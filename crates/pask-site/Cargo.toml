[package]
name = "pask-site"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reference site producer for the wilder.pser/0.3 profile"

[features]
default = []
es256 = ["pask-wire/es256", "pask-adapter/es256"]

[dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["pem", "pkcs8", "std"] }
pask-adapter = { path = "../pask-adapter" }
pask-attest = { path = "../pask-attest" }
pask-wire = { path = "../pask-wire", features = ["std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"
thiserror = "2.0.12"

[dev-dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["pem", "pkcs8", "std", "rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }

[lints]
workspace = true
