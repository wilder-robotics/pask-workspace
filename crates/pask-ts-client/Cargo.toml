[package]
name = "pask-ts-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# This crate is the producing half of SCITT Receipt registration: it takes a
# Signed Statement produced by pask-wire, submits it to a Transparency Service
# via SCRAPI, receives a Receipt, and attaches it to form a Transparent
# Statement. It is the operational counterpart to pask-wire's offline verifier
# (PR #57). Licensed AGPL-3.0-only because it is an operational crate that
# talks to live infrastructure, not a spec-side library. See LICENSING.md.
license = "AGPL-3.0-only"
repository.workspace = true
authors.workspace = true
description = "SCRAPI client that registers Pask Signed Statements with a Transparency Service"

# Not published to crates.io: this crate is AGPL-3.0-only and is operated rather than
# distributed through the registry. A Cargo guard only. It does not change licensing,
# repository visibility, or reserve the name.
publish = false

[features]
# The workspace CI runs `cargo test --workspace --features es256`. Every
# workspace member must accept the flag so the command resolves, so this crate
# forwards the flag for issuer round-trip tests. The mock TS's Receipt
# signature remains Ed25519; attachment itself is algorithm-independent.
default = []
es256 = ["pask-wire/es256"]

[dependencies]
pask-wire = { path = "../pask-wire", default-features = false, features = ["alloc"] }
coset = { version = "0.4.2", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["pem", "pkcs8", "rand_core"] }
sha2 = { version = "0.10.9", default-features = false }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.140", default-features = false, features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[dev-dependencies]
pask-wire = { path = "../pask-wire", default-features = false, features = ["alloc", "std"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["pem", "pkcs8", "rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }

[lints]
workspace = true
