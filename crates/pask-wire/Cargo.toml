[package]
name = "pask-wire"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
# Apache-2.0, not the workspace AGPL-3.0-only default. The spec-side crates
# (pask-wire, pask-attest, pask-wire-cli) are permissive so outside parties can
# implement and independently verify this profile without a copyleft review. The
# deployment crates (pask-site, pask-adapter) remain AGPL-3.0-only.
# See LICENSING.md at the repository root.
license = "Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/pask-wire"
homepage.workspace = true
readme = "README.md"
keywords = ["cose", "scitt", "receipts", "robotics", "attestation"]
categories = ["cryptography", "encoding", "no-std"]
authors.workspace = true
description = "SCITT-style COSE receipt library for Physical-Site Engagement Receipts: supplied-key production and verification for the wilder.pser/0.5, 0.6 and 0.7 profiles, not complete conformance"

# docs.rs builds with default features. This crate's default is `[]`, which would
# document almost nothing, so name the documented surface explicitly. This changes the
# documentation build only; library default features and no_std support are unchanged.
[package.metadata.docs.rs]
features = ["alloc", "es256"]

[features]
default = []
alloc = [
    "dep:coset",
    "dep:fluent-uri",
    "dep:ed25519-dalek",
    "dep:serde",
    "dep:ryu-js",
    "dep:serde_json",
    "dep:sha2",
    "dep:time",
]
es256 = ["alloc", "dep:p256"]
std = ["alloc"]

[dependencies]
fluent-uri = { version = "0.4.1", default-features = false, features = ["alloc"], optional = true }
coset = { version = "0.4.2", default-features = false, optional = true }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["pem", "pkcs8"], optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"], optional = true }
serde = { version = "1.0.219", default-features = false, features = ["derive"], optional = true }
ryu-js = { version = "1.0.3", default-features = false, optional = true }
serde_json = { version = "1.0.140", default-features = false, features = ["alloc", "float_roundtrip"], optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }
time = { version = "=0.3.55", default-features = false, features = ["parsing"], optional = true }

[dev-dependencies]
coset = { version = "0.4.2", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["rand_core"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde_json = { version = "1.0.140", default-features = false, features = ["alloc", "float_roundtrip"] }

[lints]
workspace = true

# Every public item of this crate is gated behind `alloc` and the library default
# is `[]`. The integration tests and examples below import those items without a
# crate-level `#![cfg(feature = "alloc")]` guard, so a default-feature invocation
# such as `cargo test -p pask-wire --test chain` cannot compile them (an exit-101
# unresolved-import failure, not a test failure). Declaring the gate on
# the Cargo target makes a no-feature invocation report the missing feature
# instead, and lets the ordinary default `cargo test -p pask-wire` skip them
# cleanly. The remaining test files carry their own `#![cfg(feature = "alloc")]`
# and are left to automatic discovery. Library defaults and assertions are
# unchanged; automatic target discovery stays enabled (edition 2024).

[[test]]
name = "chain"
path = "tests/chain.rs"
required-features = ["alloc"]

[[test]]
name = "ack_provenance"
path = "tests/ack_provenance.rs"
required-features = ["alloc"]

[[test]]
name = "cose_independent"
path = "tests/cose_independent.rs"
required-features = ["alloc"]

[[test]]
name = "issue_30_66"
path = "tests/issue_30_66.rs"
required-features = ["alloc"]

[[test]]
name = "issue_67"
path = "tests/issue_67.rs"
required-features = ["alloc"]

[[test]]
name = "issuer_affiliation"
path = "tests/issuer_affiliation.rs"
required-features = ["alloc"]

[[test]]
name = "jcs_vectors"
path = "tests/jcs_vectors.rs"
required-features = ["alloc"]

[[test]]
name = "malformed"
path = "tests/malformed.rs"
required-features = ["alloc"]

[[test]]
name = "receipt"
path = "tests/receipt.rs"
required-features = ["alloc"]

[[test]]
name = "receipt_fixtures"
path = "tests/receipt_fixtures.rs"
required-features = ["alloc"]

[[test]]
name = "roundtrip"
path = "tests/roundtrip.rs"
required-features = ["alloc"]

# `draft07_payload` and `proposed_recipient_replay` carry their own
# `#[cfg(not(feature = "alloc"))]` fallback `main` and need no declaration.

[[example]]
name = "export_fixture"
path = "examples/export_fixture.rs"
required-features = ["alloc"]

[[example]]
name = "proposed07_measure"
path = "examples/proposed07_measure.rs"
required-features = ["alloc"]

[[example]]
name = "proposed_constraints"
path = "examples/proposed_constraints.rs"
required-features = ["alloc"]
