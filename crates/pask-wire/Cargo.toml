[package]
name = "pask-wire"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Apache-2.0, not the workspace AGPL-3.0-only default. The spec-side crates
# (pask-wire, pask-attest, pask-wire-cli) are permissive so outside parties can
# implement and independently verify this profile without a copyleft review. The
# deployment crates (pask-site, pask-adapter) remain AGPL-3.0-only.
# See LICENSING.md at the repository root.
license = "Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/pask-wire"
keywords = ["cose", "scitt", "receipts", "robotics", "attestation"]
categories = ["cryptography", "encoding", "no-std"]
authors.workspace = true
description = "SCITT-native COSE receipt library for Physical-Site Engagement Receipts (Pask wire format v0.1)"

[features]
default = []
alloc = [
    "dep:coset",
    "dep:fluent-uri",
    "dep:ed25519-dalek",
    "dep:serde",
    "dep:ryu-js",
    "dep:serde_json",
    "dep:sha2",
    "dep:time",
]
es256 = ["alloc", "dep:p256"]
std = ["alloc"]

[dependencies]
fluent-uri = { version = "0.4.1", default-features = false, features = ["alloc"], optional = true }
coset = { version = "0.4.2", default-features = false, optional = true }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["pem", "pkcs8"], optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"], optional = true }
serde = { version = "1.0.219", default-features = false, features = ["derive"], optional = true }
ryu-js = { version = "0.2.2", default-features = false, optional = true }
serde_json = { version = "1.0.140", default-features = false, features = ["alloc", "float_roundtrip"], optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }
time = { version = "=0.3.55", default-features = false, features = ["parsing"], optional = true }

[dev-dependencies]
coset = { version = "0.4.2", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["rand_core"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde_json = { version = "1.0.140", default-features = false, features = ["alloc", "float_roundtrip"] }

[lints]
workspace = true
