[package]
name = "pask-attest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Apache-2.0, not the workspace AGPL-3.0-only default. The spec-side crates
# (pask-wire, pask-attest, pask-wire-cli) are permissive so outside parties can
# implement and independently verify this profile without a copyleft review. The
# deployment crates (pask-site, pask-adapter) remain AGPL-3.0-only.
# See LICENSING.md at the repository root.
license = "Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/pask-attest"
keywords = ["attestation", "tee", "scitt", "cose", "robotics"]
categories = ["cryptography", "encoding"]
authors.workspace = true
description = "TEE attestation verification and typed claims for Pask receipts"

[features]
default = []
mock = []

[dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
pask-wire = { version = "0.1.0", path = "../pask-wire", features = ["std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
time = { version = "=0.3.55", default-features = false, features = ["parsing"] }

[dev-dependencies]
proptest = "1.6.0"
time = { version = "=0.3.55", default-features = false, features = ["formatting", "parsing"] }

[lints]
workspace = true
