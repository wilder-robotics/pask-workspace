# OpenSSF Scorecard analysis for pask-workspace.
#
# Published to the OpenSSF Scorecard REST API and the Scorecard badge service
# so a public score is visible at:
#   https://scorecard.dev/viewer/?uri=github.com/wilder-robotics/pask-workspace
#
# The workflow is SHA-pinned per the Pask expert panel's supply-chain hardening
# discipline. Update SHAs via Dependabot PRs, not manually.
#
# References:
#   - https://github.com/ossf/scorecard-action
#   - https://github.com/ossf/scorecard/blob/main/.github/workflows/scorecard-analysis.yml
#
# For the pask-conformance-vectors repository, copy this file verbatim except
# for the badge/viewer URLs referenced in the README.

name: Scorecard analysis workflow

on:
  push:
    # Only the default branch is supported.
    branches:
      - main
  schedule:
    # Weekly on Saturdays.
    - cron: "30 1 * * 6"
  workflow_dispatch:

# Workflow-level: read-all is the maximum. Job below elevates only what it
# needs, per Scorecard workflow restrictions.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Silently no-op while the repository is private. The Scorecard API and
    # SARIF upload to Code Scanning both require a public repo (or GitHub
    # Advanced Security on a private repo, which this project does not use).
    # This gate lets the workflow live on `main` while we're still private,
    # and start running automatically on public flip.
    if: github.event.repository.visibility == 'public'
    permissions:
      # Needed to upload SARIF to Code Scanning.
      security-events: write
      # Needed for GitHub OIDC token when publish_results is true.
      id-token: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results: true replaces the Scorecard team's weekly scan
          # of public repos with this workflow's results, and enables the
          # public badge/API. This is gated by the job-level `if:` above so
          # it does not fire until this repository is public.
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
