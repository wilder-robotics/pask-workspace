name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  scaffold-check:
    # Placeholder job — passes on the scaffold-only commit before any
    # Rust code lands. Once crates/pask-wire is added, replace this
    # job with the full Rust matrix below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify scaffold present
        run: |
          test -f LICENSE
          test -f COMMERCIAL-EXCEPTION.md
          test -f README.md
          test -f docs/draft-wilder-scitt-physical-site-engagement-receipt-00.md

