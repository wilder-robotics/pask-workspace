# Continuous integration for pask-workspace.
#
# All Actions are pinned to a full commit SHA per the panel's supply-chain
# hardening discipline. Update SHAs via Dependabot PRs, not manually.
#
# Jobs:
#   - cargo:      Rust build/test matrix (Linux + macOS + Windows).
#   - dco:        Developer Certificate of Origin sign-off check on every
#                 commit in a PR. Enforces the CONTRIBUTING.md contract.
#   - name-guard:  Public Name Rule enforcement over tracked files plus
#                 commit messages and author/committer fields. Distinct from
#                 `compliance`: different surface, different deny-list, and
#                 deliberately not merged with it.
#   - compliance: PASK-COMPLIANCE-002/003 deny-list grep over the code
#                 repository surface, plus a self-test of the deny-list.
#   - draft:      kramdown-rfc conversion, xml2rfc validation and idnits
#                 compliance for the Internet-Draft. Runs only when files under
#                 docs/ change. The draft is authored in Markdown; the RFCXML
#                 is generated here and at filing time, never committed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is NOT in the default type set
    # (opened, synchronize, reopened). Without it, the `draft` job's
    # draft==false gate could never be re-evaluated when a PR left draft
    # state, so the job stayed skipped until the next unrelated push.
    # Found on PR #27, 2026-08-09: the PR was marked ready and the repaired
    # draft-validation job still reported "skipping" because no event fired.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  cargo:
    name: Cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build all features
        run: cargo build --workspace --all-features

      - name: Test default features
        run: cargo test --workspace

      - name: Test ES256 features
        run: cargo test --workspace --features es256

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    # Only PR events — pushes to main have already passed this gate.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check DCO sign-off on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          echo "Checking commits between $BASE_SHA and $HEAD_SHA for DCO sign-off"
          missing=0
          # List each commit and verify Signed-off-by trailer.
          #
          # Exemption: authenticated Dependabot PR commits are skipped.
          # Rationale: Dependabot cannot add a Signed-off-by trailer to its
          # own commits. The event payload authenticates the PR owner, while
          # the name and fixed noreply address constrain which commits in that
          # PR are exempt. This does not verify commit signature status.
          for sha in $(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA"); do
            author_name=$(git show -s --format='%an' "$sha")
            author_email=$(git show -s --format='%ae' "$sha")
            if [ "$PR_AUTHOR" = 'dependabot[bot]' ] \
              && [ "$author_name" = 'dependabot[bot]' ] \
              && [ "$author_email" = '49699333+dependabot[bot]@users.noreply.github.com' ]; then
              echo "  ⊘ $sha  authenticated Dependabot commit — DCO exempt"
              continue
            fi
            expected="Signed-off-by: ${author_name} <${author_email}>"
            if git show -s --format='%B' "$sha" | grep -Fq "$expected"; then
              echo "  ✓ $sha  $expected"
            else
              echo "  ✗ $sha  missing or mismatched DCO trailer"
              echo "     expected: $expected"
              echo "     trailers found:"
              git show -s --format='%B' "$sha" | grep -iE '^signed-off-by:' || echo "       (none)"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "DCO check failed: $missing commit(s) missing a Signed-off-by trailer."
            echo "See CONTRIBUTING.md and https://developercertificate.org/."
            echo "Fix: 'git commit --amend --signoff' or 'git rebase --signoff BASE_SHA'."
            exit 1
          fi
          echo ""
          echo "All commits are DCO-signed."

  compliance:
    name: Compliance grep
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Self-test first. A deny-list whose patterns have silently stopped
      # matching reports a clean repository, which is the failure mode this
      # whole job exists to prevent.
      - name: Self-test the deny-list
        run: bash scripts/compliance_grep.sh --self-test

      - name: Scan the repository
        run: bash scripts/compliance_grep.sh

  draft:
    name: Draft (xml2rfc + idnits)
    runs-on: ubuntu-latest
    # Skip when the PR is still in draft state; always run on push to main.
    # Paired with `ready_for_review` in the trigger types above: this gate is
    # only meaningful if an event fires when the PR leaves draft.
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history. The change filter below diffs the PR base against
          # its head; under the default shallow clone neither object exists
          # locally, `git diff` fails, and the filter silently reports "no
          # draft changes" -- which is how this job passed in 5s while
          # validating nothing. See the filter's own guard.
          fetch-depth: 0

      - name: Detect draft-affecting changes
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          # Fail loudly rather than degrading to "nothing changed". A filter
          # that cannot see the objects it is asked to compare must not be
          # allowed to answer the question -- an unanswerable filter reporting
          # false is a green check over an unrun validation.
          for rev in "$base" "$head"; do
            if ! git cat-file -e "${rev}^{commit}" 2>/dev/null; then
              echo "::error::Change filter cannot resolve ${rev}. Refusing to" \
                   "report 'no draft changes' from an incomplete clone."
              exit 1
            fi
          done

          changed="$(git diff --name-only "$base" "$head")"
          echo "Files changed in this PR:"
          echo "${changed}" | sed 's/^/  /'

          # This workflow is in the pattern deliberately. The gate's own
          # exception logic is the part most likely to be wrong, and a filter
          # that skips validation when only the gate changed means a change to
          # the gate is merged without the gate ever having run under it. That
          # is how the accepted-exception block went stale and stayed stale
          # over three merges: nothing ever re-ran it.
          if echo "${changed}" | grep -qE '^(docs/.*\.(xml|md)|\.github/workflows/ci\.yml)$'; then
            echo "Draft sources or the draft gate itself changed; validating."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No draft sources changed; validation not required."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install xml2rfc + idnits
        if: steps.filter.outputs.run == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Pin exact versions; refresh via Dependabot on the pip ecosystem.
          pip install "xml2rfc==3.24.0"
          # kramdown-rfc converts the Markdown source to RFCXML.
          # --user-install: the runner's system gem directory
          # (/var/lib/gems) is not writable by the build user, and an
          # unqualified `gem install` fails with Gem::FilePermissionError.
          gem install --no-document --user-install kramdown-rfc2629 -v 1.7.39
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"
          export PATH="$(ruby -e 'puts Gem.user_dir')/bin:$PATH"
          # Fail here rather than at the conversion step if the gem is not
          # actually reachable on PATH.
          kdrfc --version
          # idnits ships as a Perl script from the IETF tools tarball.
          curl -sSL -o /tmp/idnits.tgz \
            https://github.com/ietf-tools/idnits/archive/refs/tags/2.17.1.tar.gz
          tar -xzf /tmp/idnits.tgz -C /tmp
          sudo install -m 0755 /tmp/idnits-2.17.1/idnits /usr/local/bin/idnits
          # Fail here rather than at the validation step if the install broke.
          idnits --version

      - name: Convert, validate and lint the draft
        if: steps.filter.outputs.run == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(docs/draft-wilder-scitt-physical-site-engage-receipt-*.md)
          if [ ${#sources[@]} -eq 0 ]; then
            echo "::error::No draft Markdown source found under docs/."
            echo "Expected docs/draft-wilder-scitt-physical-site-engage-receipt-<rev>.md"
            echo "This job previously globbed a filename stem that has never existed"
            echo "in this tree, so it passed unconditionally without validating"
            echo "anything. Do not restore that behaviour: a draft that xml2rfc"
            echo "rejects must fail here, not at the IETF submission tool."
            exit 1
          fi
          if [ ${#sources[@]} -gt 1 ]; then
            echo "::error::Found ${#sources[@]} revisions of the draft under docs/: ${sources[*]}"
            echo "Exactly one revision is maintained at a time."
            exit 1
          fi
          src="${sources[0]}"
          xml="/tmp/$(basename "${src%.md}").xml"
          txt="/tmp/$(basename "${src%.md}").txt"

          echo "== kramdown-rfc2629: $src =="
          kramdown-rfc2629 "$src" > "$xml"

          echo "== xml2rfc: $xml =="
          xml2rfc --v3 --text --out "$txt" "$xml"

          echo "== idnits: $txt =="
          # idnits exits 0 whatever it finds, so its verdict must be read out
          # of its report rather than out of its status. Without this the job
          # reports success over a draft idnits has rejected -- which is what
          # it did on 2026-08-09, passing while idnits printed "1 error".
          idnits "$txt" | tee /tmp/idnits.out

          summary="$(grep -E '^\s*Summary:' /tmp/idnits.out | tail -1)"
          if [ -z "${summary}" ]; then
            echo "::error::idnits produced no Summary line. Its report format" \
                 "changed, or it did not complete. Refusing to infer a pass."
            exit 1
          fi
          echo "idnits verdict: ${summary}"

          # Extract with grep -o, not a sed substitution. A sed 's/.*X.*/\1/'
          # that fails to match silently emits the whole input line, so a
          # regex typo turns a count into a sentence and the comparison below
          # becomes meaningless. grep -o yields nothing on no match, which the
          # guard then catches.
          errors="$(grep -oE '[0-9]+ error' <<<"${summary}" | head -1 | grep -oE '[0-9]+' || true)"
          flaws="$(grep -oE '[0-9]+ flaw' <<<"${summary}" | head -1 | grep -oE '[0-9]+' || true)"

          if [ -z "${errors}" ] || [ -z "${flaws}" ]; then
            echo "::error::Could not read error and flaw counts from idnits" \
                 "summary: ${summary}"
            exit 1
          fi

          # Two accepted exceptions, enumerated by hand and by name.
          #
          # This block used to count errors and compare the count to 1. That
          # is the wrong shape: a count says nothing about which error it is,
          # so a second, different error arriving alongside the accepted one
          # produced a failure with no way to distinguish "the known nit is
          # still here" from "something new broke". Worse, the reverse holds
          # too -- had the known nit ever disappeared, a brand new single
          # error would have been silently accepted in its place.
          #
          # So enumerate instead. Every line idnits marks with ** is matched
          # against the allowlist below. One unmatched ** line fails the job,
          # whatever the totals say.
          #
          # EXCEPTION 1 -- the 8 long lines in the payload figure.
          #
          # The payload figure is the byte-identical output of
          # `pask-wire-cli canonical-example`, and it carries full SHA-256
          # digests. A 64-character hex digest inside a JSON string exceeds
          # idnits' 72-column limit at ZERO indentation, so these 8 lines
          # cannot be shortened by reformatting. The only ways to clear the
          # nit are to truncate the digests -- which would make the figure a
          # hand-edited fiction again and destroy the anti-drift guard this
          # revision exists to build -- or to stop showing a real payload.
          # Pinned to the exact count: a ninth long line is a new one, and
          # fails.
          #
          # EXCEPTION 2 -- the normative downref to RFC 8785.
          #
          # RFC 8785 (JSON Canonicalization Scheme) is Informational and an
          # Independent Submission, and it is not in the IETF downref
          # registry. This document is standards track, so a normative
          # reference to it is a genuine downref under RFC 3967, and idnits
          # is right to say so.
          #
          # It is not a defect and it is not fixable here. JCS is the
          # canonicalization the receipt chain is defined over: chain.hash is
          # computed across the JCS form, and `Payload::to_jcs` in pask-wire
          # implements it. A producer that serialized differently would emit
          # a receipt that fails verification. That is a normative
          # dependency by any reading, and demoting the reference to
          # informative to quiet a linter would misdescribe the profile.
          #
          # A downref is resolved at IESG evaluation, not by the author and
          # not at submission time. It does not block posting a revision.
          # Pinned to RFC 8785 by number: a downref to any other document is
          # a new one, and fails.
          expected_long_lines=8

          allowed_error='^(There are '"${expected_long_lines}"' instances of too long lines|Downref: Normative reference to an Informational RFC: RFC 8785)'

          unexpected=0
          while IFS= read -r line; do
            # Strip idnits' leading indent and its ** marker, and drop the
            # trailing text of wrapped messages by matching only the head.
            msg="$(sed -E 's/^[[:space:]]*\*\*[[:space:]]*//' <<<"${line}")"
            if grep -qE "${allowed_error}" <<<"${msg}"; then
              echo "accepted: ${msg}"
            else
              echo "::error::Unexpected idnits error, not on the allowlist in" \
                   "this workflow: ${msg}"
              unexpected=1
            fi
          done < <(grep -E '^[[:space:]]*\*\*[[:space:]]' /tmp/idnits.out || true)

          if [ "${unexpected}" != "0" ]; then
            echo "::error::At least one idnits error is not an accepted" \
                 "exception. Fix the draft, or add the exception to this" \
                 "workflow with the reasoning written down."
            exit 1
          fi

          # Both exceptions must still be present in the counts they were
          # pinned at. If the allowlist matched every ** line but the totals
          # disagree, the report format has changed and the comparison above
          # is no longer trustworthy.
          accepted_count="$(grep -cE '^[[:space:]]*\*\*[[:space:]]' /tmp/idnits.out || true)"
          if [ "${errors}" != "${accepted_count}" ]; then
            echo "::error::idnits counted ${errors} error(s) but printed" \
                 "${accepted_count} '**' line(s). Its report format changed." \
                 "Refusing to infer a pass."
            exit 1
          fi
          errors=0

          if [ "${errors}" != "0" ] || [ "${flaws}" != "0" ]; then
            echo "::error::idnits reports ${errors} error(s) and ${flaws} flaw(s)" \
                 "beyond the accepted exception. See the report above."
            exit 1
          fi

  name-guard:
    name: Public Name Rule
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: this job reads commit messages and author fields,
          # which a shallow clone does not carry.
          fetch-depth: 0
          persist-credentials: false

      # The self-test runs first and unconditionally. A matcher that has
      # silently stopped matching reports a clean repository, which is the
      # exact failure this job exists to prevent. It ran clean once while
      # blind, and that clean result is why the incident lasted 29 hours.
      - name: Self-test the matcher
        run: bash scripts/name_guard.sh --self-test

      - name: Scan tracked files
        run: bash scripts/name_guard.sh --files

      # Commit messages and author fields, over this PR's range only.
      # History before the rule existed contains identity strings the rule
      # retired; those are handled by .mailmap, not by rewriting merged
      # commits. Scanning all of history here would fail every run and the
      # pressure would be to add an exception.
      - name: Scan commit messages and author fields
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/name_guard.sh --commits "$BASE_SHA".."$HEAD_SHA"
