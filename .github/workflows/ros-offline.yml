name: ROS dev2 offline checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'examples/ros-evidence-dev2/**'
      - '.github/workflows/ros-offline.yml'
permissions:
  contents: read
concurrency:
  group: ros-offline-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.3'
      - name: Install declared test dependency, no cache or fallback
        run: >-
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all:
          --retries 0 --timeout 30 -r examples/ros-evidence-dev2/requirements-offline.txt
      - name: Plan and ordinary Python tests, no Docker or ROS
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B examples/ros-evidence-dev2/local_run.py plan
          python -B examples/ros-evidence-dev2/tests/test_offline.py
          python -B examples/ros-evidence-dev2/tests/test_smoke.py
          python -B examples/ros-evidence-dev2/tests/test_local_runtime.py
          python -B examples/ros-evidence-dev2/tests/test_runtime_module.py
